apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-genai-dashboards
  labels:
    {{- include "genai-dashboards.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-genai-dashboards
subjects:
  - kind: ServiceAccount
    name: {{ include "genai-dashboards.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
