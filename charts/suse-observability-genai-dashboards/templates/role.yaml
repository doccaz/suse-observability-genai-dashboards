apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-genai-dashboards
  labels:
    {{- include "genai-dashboards.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "genai-dashboards.idConfigMapName" . | quote }}]
    verbs: ["get", "update", "patch"]
